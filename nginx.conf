events { worker_connections 1024; }

http {
    # Define a rate limit zone: 10 requests per minute per IP address
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

    upstream backend_cluster {
        server backend:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            # Apply the rate limit zone with a burst capacity of 3 requests
            limit_req zone=api_limit burst=3 nodelay;

            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}