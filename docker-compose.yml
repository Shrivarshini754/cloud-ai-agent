version: '3.8'

services:
  redis_cache:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - tutor-net

  backend:
    build: .
    command: uvicorn backend:app --host 0.0.0.0 --port 8000
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    networks:
      - tutor-net
    deploy:
      replicas: 2
    env_file:
      - .env

  load_balancer:
    image: nginx:latest
    container_name: load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - tutor-net

  frontend:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_API_URL=http://load_balancer:80
    depends_on:
      - load_balancer
    networks:
      - tutor-net

networks:
  tutor-net:
    driver: bridge