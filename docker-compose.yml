version: '3.8'

services:
  # Distributed Shared In-Memory Cache (Redis)
  redis_cache:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - tutor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Backend Microservice Replicas (FastAPI)
  backend:
    build: .
    command: uvicorn backend:app --host 0.0.0.0 --port 8000
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis_cache:
        condition: service_healthy
    networks:
      - tutor-net
    deploy:
      replicas: 2

  # Nginx Layer 7 Reverse Proxy & Load Balancer
  load_balancer:
    image: nginx:latest
    container_name: load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - tutor-net

  # Frontend Web Interface (Streamlit)
  frontend:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - load_balancer
    networks:
      - tutor-net

networks:
  tutor-net:
    driver: bridge